<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login & Signup</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container">
        <div class="form-container" id="formContainer">
            <!-- Login Form -->
            <div class="form-side login-form">
                <h2 class="form-title">Welcome Back</h2>

                <form id="loginForm">
                    <div class="form-group">
                        <input type="email" class="form-input" placeholder="Email Address" required>
                        <span class="input-icon">📧</span>
                    </div>

                    <div class="form-group">
                        <input type="password" class="form-input" placeholder="Password" required>
                        <span class="input-icon password-toggle" onclick="togglePassword(this)">👁️</span>
                    </div>

                    <button type="submit" class="form-button" id="loginBtn">
                        <div class="loading"></div>
                        Sign In
                    </button>
                </form>

                <div class="switch-form">
                    Don't have an account?
                    <a href="#" class="switch-link" onclick="flipForm()">Sign Up</a>
                </div>
            </div>

            <!-- Signup Form -->
            <div class="form-side signup-form">
                <h2 class="form-title">Create Account</h2>

                <form id="signupForm" method="POST" action="loginSignup.php">
                    <div class="form-group">
                        <input type="text" name="full_name" class="form-input" placeholder="Full Name" required>
                        <span class="input-icon">👤</span>
                    </div>

                    <div class="form-group">
                        <input type="email" name="email" class="form-input" placeholder="Email Address" required>
                        <span class="input-icon">📧</span>
                    </div>

                    <div class="form-group">
                        <input type="password" name="password" class="form-input" placeholder="Password" required>
                        <span class="input-icon password-toggle" onclick="togglePassword(this)">👁️</span>
                    </div>

                    <div class="form-group">
                        <input type="password" name="confirm_password" class="form-input" placeholder="Confirm Password"
                            required>
                        <span class="input-icon">🔒</span>
                    </div>

                    <button type="submit" class="form-button" id="signupBtn">
                        <div class="loading"></div>
                        Create Account
                    </button>

                    <div id="g_id_onload"
                        data-client_id="142493982290-8md93bogstqhgq5su408ur27jlse277e.apps.googleusercontent.com"
                        data-callback="handleGoogleResponse" data-auto_prompt="false">
                    </div>

                    <div class="g_id_signin" data-type="standard"></div>
                </form>


                <div class="switch-form">
                    Already have an account?
                    <a href="#" class="switch-link" onclick="flipForm()">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>

</html>
